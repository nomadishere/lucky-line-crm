<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Invoice · Lucky Line Roofing</title>
<link rel="icon" href="img/lucky-line-logo.png">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<div class="band"><div class="in"><div class="logo"><img src="img/lucky-line-logo.png" alt="Lucky Line Roofing"></div>
 <div class="who"><b>Lucky Line Roofing LLC</b><br>406-609-9950 · luckylineroofing.com<br>Livingston, Montana</div></div></div>
<div class="wrap" id="app"><div class="titlecard"><h1>Loading your invoice…</h1></div></div>
<script>
const SB='https://wwqjoagdnclaylllzcut.supabase.co',KEY='sb_publishable_AVIpI00DFiYwugP16-wMWQ_qENLObrc';
const T=new URLSearchParams(location.search).get('t')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const ROOF='<svg width="30" height="16" viewBox="0 0 30 16" aria-hidden="true"><path d="M1 9 L15 2 L29 9" fill="none" stroke="#16603A" stroke-width="2"/><line x1="7" y1="14" x2="23" y2="14" stroke="#16603A" stroke-width="2"/></svg>';
const hdr=s=>`<div class="hdr"><div class="brand">${ROOF}LUCKY LINE ROOFING</div><div class="section">${s}</div></div>`;
async function call(){const r=await fetch(SB+'/rest/v1/rpc/crm_portal',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:T,p_action:'view',p:{}})});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error((d&&d.message)||'Something went wrong. Please call 406-609-9950.');return d}
const A=document.getElementById('app');
async function payCard(btn){btn.disabled=true;btn.textContent='Opening secure checkout…';try{const r=await fetch(SB+'/functions/v1/crm-pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:T,back:location.href})});const d=await r.json();if(d.url){location.href=d.url;return}throw new Error(d.error||'Card payments are not available right now.')}catch(e){btn.textContent=e.message;setTimeout(()=>{btn.disabled=false;btn.textContent='Pay by card or bank'},4000)}}
(async()=>{try{const d=await call();const i=d.invoice,t=d.totals,bal=Math.max(0,(+t.total)-(+t.paid));const paidNow=new URLSearchParams(location.search).get('paid');
 A.innerHTML=`<div class="titlecard"><h1>Invoice #${esc(i.number)}</h1><div class="prop">${esc(d.job.title)}${d.job.address?'<br><span style="font-weight:normal">'+esc(d.job.address)+'</span>':''}</div>
  <div class="meta">Bill to: ${esc(d.customer)}<br>Issued: ${esc(i.issued_on)}${i.due_on?'<br>Due: '+esc(i.due_on):''}</div><div class="tag">Shelter you can count on, service you'll remember.</div></div>
 ${paidNow&&bal>0?`<div class="sec ok"><h2>Thank you!</h2><p>Your payment is processing. This page updates once it clears.</p></div>`:''}
 <div class="sec">${hdr(i.title||'Invoice')}
  <table><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead><tbody>${(d.lines||[]).map(l=>`<tr><td>${esc(l.item)}</td><td class="num">${esc(+l.qty)}</td><td class="num">${money(l.amount)}</td></tr>`).join('')}
   <tr><td colspan="2"><b>Total</b></td><td class="num"><b>${money(t.total)}</b></td></tr>${(d.payments||[]).map(p=>`<tr><td colspan="2">Paid ${esc(p.paid_at)} · ${esc(p.method||'')}</td><td class="num">−${money(p.amount)}</td></tr>`).join('')}
   <tr class="total"><td colspan="2">${bal>0?'BALANCE DUE':'PAID IN FULL'}</td><td class="num">${money(bal)}</td></tr></tbody></table>
  ${i.notes?`<p style="margin-top:12px">${esc(i.notes)}</p>`:''}</div>
 ${bal>0?`<div class="sec">${hdr('How to pay')}<div class="big">${money(bal)}</div>
  <div class="row no-print">${d.card_enabled==='true'?`<button class="btn p" onclick="payCard(this)">Pay by card or bank</button>`:''}${d.pay_link?`<a class="btn ${d.card_enabled==='true'?'':'p'}" href="${esc(d.pay_link)}" target="_blank" rel="noopener">Pay online</a>`:''}${d.financing_link?`<a class="btn" href="${esc(d.financing_link)}" target="_blank" rel="noopener">Monthly payment options</a>`:''}</div>
  <div class="box" style="margin-top:12px">${esc(d.pay_instructions||'Call 406-609-9950 to pay.')}</div></div>`:`<div class="sec ok"><h2>Paid in full. Thank you!</h2><p>We appreciate your business. If anything ever comes up with your roof, call us.</p></div>`}
 <div class="sec">${hdr('Questions?')}<div class="people"><div><b>Justin Walton</b><br><a href="tel:4153005496">415-300-5496</a><br><a href="mailto:jw@luckylineroofing.com">jw@luckylineroofing.com</a></div><div><b>Gage McDonnell</b><br><a href="tel:4066099950">406-609-9950</a><br><a href="mailto:gage.mcdonnell@luckylineroofing.com">gage.mcdonnell@luckylineroofing.com</a></div></div>
  <div class="row no-print"><button class="btn" onclick="print()">Print or save as PDF</button></div>
  <div class="ftr"><span><i>Shelter you can count on, service you'll remember.</i></span><span>406-609-9950 · luckylineroofing.com</span></div></div>`}
 catch(e){A.innerHTML=`<div class="titlecard"><h1>We couldn't open this invoice</h1><p>${esc(e.message)}</p><div class="row"><a class="btn p" href="tel:4066099950">Call 406-609-9950</a></div></div>`}})();
</script>
</body>
</html>
